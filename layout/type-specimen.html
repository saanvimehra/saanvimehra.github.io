<section class="type-lab" aria-label="Guthli type specimen">
<label class="type-small" for="type-words">Your words</label>
<textarea id="type-words" rows="2" spellcheck="false" aria-describedby="type-help" maxlength="240">Saanvi Mehra</textarea>
<p id="type-help">Type above to try your own letters.</p>
<div class="type-controls" hidden>
<fieldset id="type-faces"><legend>Typeface</legend>
<label><input type="radio" name="type-face" value="guthli" checked>Guthli</label>
<label><input type="radio" name="type-face" value="nyght">Nyght Serif</label>
<label><input type="radio" name="type-face" value="onest">Onest</label>
</fieldset>
<div class="type-axis">
<label for="type-reach">Serif reach</label>
<output id="type-value" for="type-reach">52%</output>
<input id="type-reach" type="range" min="0" max="100" value="52" step="1">
<div class="type-endpoints"><span>Sans</span><span>Serif</span></div>
</div></div>
<a class="type-download" href="../assets/Guthli-typeface.zip" download>Download the typeface</a>
</section>
<script src="../assets/type-specimen.js" defer></script>

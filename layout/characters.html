<div class="character-sheet" id="workshop">
  <p class="folio">Guthli 1.0 · $count Unicode characters</p>
  <div class="sheet-tools">
  <details><summary>Type settings</summary>
    <div class="character-controls">
    <fieldset><legend>Cut</legend>
      <label><input type="radio" name="char-cut" value="open">Open g</label>
      <label><input type="radio" name="char-cut" value="loop" checked>Looped g</label>
    </fieldset>
    <label class="char-range" hidden>Serif reach <output for="char-reach">45%</output>
      <input id="char-reach" type="range" min="0" max="100" value="45">
    </label>
    </div>
  </details>
  <a href="../assets/Guthli-1.0.zip" download>Download Guthli 1.0 ↓</a>
  </div>
  $sections
  <section><h2>Tabular numerals</h2><p>The same ten digits, set to equal widths.</p>
    <div class="tabular-figures">0123456789</div>
  </section>
  $afterword
</div>
<script src="../assets/character-sheet.js" defer></script>
